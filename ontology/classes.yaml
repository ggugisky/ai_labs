version: 1
namespace: ailabs
classes:
  Document:
    description: A source note, meeting note, or reviewed wiki page.
  Meeting:
    description: A dated AI Labs meeting record.
  Concept:
    description: A reusable idea, pattern, or method.
  Tool:
    description: An AI tool, library, model, platform, or product component.
  Service:
    description: A user-facing service or product built with tools and concepts.
  UseCase:
    description: A concrete problem or workflow addressed by a service or tool.
  Project:
    description: A project or product discussed by AI Labs.
  Person:
    description: An AI Labs participant or referenced person.
  Organization:
    description: A community, team, company, or other organizational group.
  Decision:
    description: A reviewed choice or conclusion.
  Source:
    description: An external source or reference artifact.
